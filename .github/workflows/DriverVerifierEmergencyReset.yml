name: DriverVerifierEmergencyReset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type YES to confirm — this resets ALL Verifier settings and reboots'
        required: true

env:
  WATCHDOG_TASK_NAME: 'WellspringVerifierWatchdog'
  WATCHDOG_REG_KEY: 'HKLM:\SOFTWARE\WellspringVerifierWatchdog'

jobs:
  reset:
    runs-on: [self-hosted, windows, x64, wellspring-hw]
    steps:
      - name: Validate confirmation
        shell: powershell
        run: |
          if ("${{ github.event.inputs.confirm }}" -ne "YES") {
            Write-Error "Confirmation not provided. Aborting."
            exit 1
          }

      - name: Reset Verifier and remove watchdog
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          verifier /reset
          if (Test-Path $env:WATCHDOG_REG_KEY) {
            Set-ItemProperty -Path $env:WATCHDOG_REG_KEY -Name "Armed" -Value 0 -Type DWord
          }
          Unregister-ScheduledTask -TaskName $env:WATCHDOG_TASK_NAME -Confirm:$false -ErrorAction SilentlyContinue
          Write-Host "Verifier reset. Rebooting."
          shutdown.exe /r /t 15 /c "Emergency Verifier reset"