name: DriverVerifierConfirmPostReboot
on:
  workflow_dispatch:

concurrency:
  group: driver-verifier-confirm-${{ github.workflow }}
  cancel-in-progress: false

env:
  DRIVER_FILE: AmtPtpDeviceUsbKm.sys
  WATCHDOG_TASK_NAME: 'WellspringVerifierWatchdog'
  WATCHDOG_REG_KEY: 'HKLM:\SOFTWARE\WellspringVerifierWatchdog'

jobs:
  confirm:
    runs-on: [self-hosted, windows, x64, wellspring-hw]
    timeout-minutes: 15
    steps:
      - name: Check whether a crash dump exists from the reboot
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'

          if (-not (Test-Path 'C:\Windows\MEMORY.DMP')) {
            Write-Host 'No crash dump present. Clean boot.'
            exit 0
          }

          $dmp = Get-Item 'C:\Windows\MEMORY.DMP'
          $os = Get-CimInstance Win32_OperatingSystem
          $bootTime = $os.LastBootUpTime

          Write-Host ('MEMORY.DMP LastWriteTime: ' + $dmp.LastWriteTime)
          Write-Host ('System LastBootUpTime:    ' + $bootTime)

          # A dump produced by the crash that caused this reboot is written
          # moments before the reboot completes, so its LastWriteTime lands
          # within a few minutes of LastBootUpTime. A dump from an older,
          # unrelated crash will be much older than the current boot time.
          $deltaMinutes = ($bootTime - $dmp.LastWriteTime).TotalMinutes

          if ($deltaMinutes -ge -2 -and $deltaMinutes -le 15) {
            Write-Error ('MEMORY.DMP was written ~' + [math]::Round($deltaMinutes,1) + ' min before this boot - Verifier almost certainly caught a real violation on THIS run. Do not disarm the watchdog; analyze the dump first.')
            exit 1
          } else {
            Write-Warning 'MEMORY.DMP exists but predates the current boot by a wide margin - likely a stale dump from an earlier, unrelated crash. Continuing, but consider clearing it before the next run.'
          }

      - name: Verify Driver Verifier is active with expected flags
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $queryLines = verifier /query
          $queryText = $queryLines -join "`n"
          Write-Host $queryText

          if ($queryText -notmatch [regex]::Escape($env:DRIVER_FILE)) {
            Write-Error ('Verifier is NOT monitoring ' + $env:DRIVER_FILE + '. Flags may not have survived the reboot.')
            exit 1
          }
          Write-Host ('Verifier confirmed active on ' + $env:DRIVER_FILE + '.')

      - name: Verify driver service and device are healthy
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $svc = Get-Service -Name AmtPtpDeviceUsbKm
          if ($svc.Status -ne 'Running') {
            Write-Error ("Service status is '" + $svc.Status + "', expected 'Running'.")
            exit 1
          }

          $wellspringDevices = Get-PnpDevice | Where-Object { $_.FriendlyName -like '*Wellspring*' }
          $wellspringDevices | Format-Table Status, Class, FriendlyName, InstanceId -AutoSize

          $bad = $wellspringDevices | Where-Object { $_.Status -ne 'OK' }
          if ($bad) {
            Write-Error 'One or more Wellspring PnP devices are not in OK state.'
            exit 1
          }
          Write-Host 'Service and device state OK.'

      - name: Disarm watchdog
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (Test-Path $env:WATCHDOG_REG_KEY) {
            Set-ItemProperty -Path $env:WATCHDOG_REG_KEY -Name 'Armed' -Value 0 -Type DWord
            Set-ItemProperty -Path $env:WATCHDOG_REG_KEY -Name 'DisarmedAtUtc' -Value (Get-Date).ToUniversalTime().ToString('o') -Type String
          }
          Unregister-ScheduledTask -TaskName $env:WATCHDOG_TASK_NAME -Confirm:$false -ErrorAction SilentlyContinue
          Write-Host 'Watchdog disarmed and scheduled task removed. System confirmed stable under Verifier.'

      - name: Write confirmation log
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'C:\VerifierRuns' -Force | Out-Null
          $log = 'C:\VerifierRuns\post-reboot-confirmed-' + (Get-Date -Format yyyyMMdd-HHmmss) + '.txt'
          ('Confirmed at ' + (Get-Date -Format o)) | Out-File -FilePath $log -Encoding utf8
          verifier /query | Out-File -FilePath $log -Append -Encoding utf8
          Write-Host ('Confirmation log: ' + $log)