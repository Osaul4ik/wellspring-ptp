name: BuildAll (Driver + ConfigGui)

on:
  push:
    branches: [ master, TestHID ]
  pull_request:
    branches: [ master, TestHID ]
  workflow_dispatch:

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # ---- Драйвер ----
  PROJECT_DIR: src/AmtPtpDeviceUsbKm
  DRIVER_NAME: AmtPtpDeviceUsbKm
  CONFIGURATION: Release
  PLATFORM: x64
  # ---- GUI ----
  GUI_PROJECT_DIR: src/AmtPtpConfigGui
  GUI_PROJECT_NAME: AmtPtpConfigGui

jobs:

  # =============================================================================
  # Єдиний job: драйвер + GUI + пакування збираються послідовно в одному
  # раннері. Це зроблено навмисно, щоб НЕ плодити проміжні upload-artifact
  # (driver / gui / gui-standalone) - GitHub показує в списку артефактів
  # запуску буквально все, що було завантажено через upload-artifact, тож
  # єдиний спосіб мати в результаті рівно два артефакти - взагалі не
  # завантажувати проміжні файли, а передавати їх між кроками просто через
  # файлову систему раннера.
  #
  # У кінці завантажуються ТІЛЬКИ два фінальні артефакти:
  #   - WellspringPTP-Min-<version>   (Driver + GUI framework-dependent, без
  #     вбудованого .NET runtime)
  #   - WellspringPTP-Full-<version>  (Driver + GUI self-contained)
  # Кожен з них - це папка WellspringPTP/{Driver,Gui}, яку upload-artifact
  # архівує РІВНО ОДИН РАЗ під час завантаження (без ручного zip кроку) -
  # тому при скачуванні з UI користувач отримує один .zip з папкою
  # WellspringPTP всередині, а не архів-в-архіві.
  # =============================================================================
  build-and-package:
    name: Build Driver + GUI, package archives
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    # =====================================================================
    # Перевірка секретів підпису ДО збірки, щоб не витрачати час
    # раннера на компіляцію, якщо секрети для test-signing не налаштовані.
    # =====================================================================
    - name: Validate signing secrets are present
      run: |
        $ErrorActionPreference = "Stop"
        Write-Host "==> Checking SIGN_CERT_PFX / SIGN_CERT_PASSWORD secrets"

        if ([string]::IsNullOrWhiteSpace($env:SIGN_CERT_PFX)) {
          Write-Error "Secret SIGN_CERT_PFX is not set in GitHub Secrets. Add the Base64-encoded PFX certificate in Settings -> Secrets and variables -> Actions."
          exit 1
        }
        if ([string]::IsNullOrWhiteSpace($env:SIGN_CERT_PASSWORD)) {
          Write-Error "Secret SIGN_CERT_PASSWORD is not set in GitHub Secrets."
          exit 1
        }

        Write-Host "OK: both secrets are present."
      shell: pwsh
      env:
        SIGN_CERT_PFX: ${{ secrets.CERT }}
        SIGN_CERT_PASSWORD: ${{ secrets.CERT_PWD }}

    - name: Install WDK
      run: |
        $ErrorActionPreference = "Stop"
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2085767"
        $wdkInstaller = "$env:TEMP\wdksetup.exe"
        Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller
        $proc = Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -Wait -PassThru
        $exitCode = $proc.ExitCode
        if ($exitCode -ne 0 -and $exitCode -ne 3010) {
          Write-Error "WDK installer exited with code $exitCode"
          exit 1
        }
        Write-Host "OK: WDK installer exited with code $exitCode"
      shell: pwsh

    # =====================================================================
    # Обчислення версії/дати драйвера на основі поточної дати й часу, як в
    # інших workflow цього репозиторію - для узгодженого нейминга артефактів.
    # =====================================================================
    - name: Compute driver version and date
      run: |
        $ErrorActionPreference = "Stop"
        $now = Get-Date

        $driverDate    = $now.ToString("MM/dd/yyyy")
        $driverVersion = "1.$($now.Year).$($now.ToString('MMdd')).$($now.ToString('HHmm'))"

        Write-Host "==> Driver date (DriverVer date): $driverDate"
        Write-Host "==> Driver version (DriverVer ver): $driverVersion"

        Add-Content -Path $env:GITHUB_ENV -Value "DRIVER_DATE=$driverDate"
        Add-Content -Path $env:GITHUB_ENV -Value "DRIVER_VERSION=$driverVersion"
      shell: pwsh

    - name: Build USB KM Driver
      run: |
        msbuild "$env:PROJECT_DIR\$env:DRIVER_NAME.vcxproj" `
          /p:Configuration=$env:CONFIGURATION `
          /p:Platform=$env:PLATFORM `
          /p:WindowsTargetPlatformVersion=10.0.26100.0 `
          /nologo /verbosity:minimal /clp:Summary
      shell: pwsh

    # =====================================================================
    # Стемпаємо .inf (дата/версія/архітектура) тим самим StampInf, що й
    # інші workflow, - без цього WDK/Inf2Cat/PnP не приймуть INF як валідний.
    # =====================================================================
    - name: Locate StampInf.exe
      run: |
        $ErrorActionPreference = "Stop"
        $roots = @(
          "C:\Program Files (x86)\Windows Kits\10\bin",
          "C:\Program Files\Windows Kits\10\bin"
        )
        $candidates = foreach ($root in $roots) {
          if (Test-Path $root) {
            Get-ChildItem -Path $root -Filter "StampInf.exe" -Recurse -ErrorAction SilentlyContinue
          }
        }
        if (-not $candidates) {
          Write-Error "StampInf.exe was not found on this runner."
          exit 1
        }
        $tool = $candidates | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $tool) { $tool = $candidates | Sort-Object FullName -Descending | Select-Object -First 1 }
        Add-Content -Path $env:GITHUB_ENV -Value "STAMPINF_PATH=$($tool.FullName)"
      shell: pwsh

    - name: Prepare driver package folder
      run: |
        $ErrorActionPreference = "Stop"

        $buildOutDir = "$env:PROJECT_DIR\build\$env:DRIVER_NAME\$env:PLATFORM\$env:CONFIGURATION"
        $sysPath     = "$buildOutDir\$env:DRIVER_NAME.sys"
        $pdbPath     = "$buildOutDir\$env:DRIVER_NAME.pdb"
        $infSrcPath  = "$env:PROJECT_DIR\$env:DRIVER_NAME.inf"
        $packageDir  = "artifacts\driver"

        if (-not (Test-Path $sysPath)) {
          Write-Error "Built .sys not found: $sysPath"
          exit 1
        }
        if (-not (Test-Path $infSrcPath)) {
          Write-Error ".inf file not found: $infSrcPath"
          exit 1
        }

        New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
        Copy-Item -Path $sysPath -Destination $packageDir -Force
        Copy-Item -Path $infSrcPath -Destination $packageDir -Force
        if (Test-Path $pdbPath) {
          Copy-Item -Path $pdbPath -Destination $packageDir -Force
        }
        Copy-Item -Path "src\InstallCert.bat" -Destination $packageDir -Force -ErrorAction SilentlyContinue
        Copy-Item -Path "src\TestMode.bat" -Destination $packageDir -Force -ErrorAction SilentlyContinue

        $infPath = Join-Path $packageDir "$env:DRIVER_NAME.inf"
        & "$env:STAMPINF_PATH" -f "$infPath" -a amd64 -d "$env:DRIVER_DATE" -v "$env:DRIVER_VERSION" -k 1.33
        if ($LASTEXITCODE -ne 0) {
          Write-Error "StampInf exited with error code $LASTEXITCODE."
          exit 1
        }

        Write-Host "OK: staged driver files:"
        Get-ChildItem $packageDir | ForEach-Object { Write-Host "  - $($_.Name)" }

        Add-Content -Path $env:GITHUB_ENV -Value "PACKAGE_DIR=$packageDir"
        Add-Content -Path $env:GITHUB_ENV -Value "SYS_PATH=$packageDir\$env:DRIVER_NAME.sys"
        Add-Content -Path $env:GITHUB_ENV -Value "INF_PATH=$packageDir\$env:DRIVER_NAME.inf"
        Add-Content -Path $env:GITHUB_ENV -Value "CAT_PATH=$packageDir\$env:DRIVER_NAME.cat"
      shell: pwsh

    # =====================================================================
    # Автопошук Inf2Cat.exe
    # =====================================================================
    - name: Locate Inf2Cat.exe
      run: |
        $ErrorActionPreference = "Stop"
        $roots = @(
          "C:\Program Files (x86)\Windows Kits\10\bin",
          "C:\Program Files\Windows Kits\10\bin"
        )
        $candidates = foreach ($root in $roots) {
          if (Test-Path $root) {
            Get-ChildItem -Path $root -Filter "Inf2Cat.exe" -Recurse -ErrorAction SilentlyContinue
          }
        }
        if (-not $candidates) {
          Write-Error "Inf2Cat.exe was not found on this runner."
          exit 1
        }
        $tool = $candidates | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $tool) { $tool = $candidates | Sort-Object FullName -Descending | Select-Object -First 1 }
        Add-Content -Path $env:GITHUB_ENV -Value "INF2CAT_PATH=$($tool.FullName)"
      shell: pwsh

    # =====================================================================
    # Генерація .cat файлу з .inf через Inf2Cat.
    # =====================================================================
    - name: Generate CAT file (Inf2Cat)
      run: |
        $ErrorActionPreference = "Stop"
        $fullPackageDir = (Resolve-Path $env:PACKAGE_DIR).Path
        & "$env:INF2CAT_PATH" /driver:"$fullPackageDir" /os:10_X64 /verbose
        if ($LASTEXITCODE -ne 0) {
          Write-Error "Inf2Cat exited with error code $LASTEXITCODE."
          exit 1
        }
        if (-not (Test-Path $env:CAT_PATH)) {
          Write-Error "Inf2Cat did not report an error, but no .cat file was produced at $env:CAT_PATH."
          exit 1
        }
        Write-Host "OK: .cat generated -> $env:CAT_PATH"
      shell: pwsh

    # =====================================================================
    # Автопошук signtool.exe
    # =====================================================================
    - name: Locate signtool.exe
      run: |
        $ErrorActionPreference = "Stop"
        $roots = @(
          "C:\Program Files (x86)\Windows Kits\10\bin",
          "C:\Program Files\Windows Kits\10\bin"
        )
        $candidates = foreach ($root in $roots) {
          if (Test-Path $root) {
            Get-ChildItem -Path $root -Filter "signtool.exe" -Recurse -ErrorAction SilentlyContinue
          }
        }
        if (-not $candidates) {
          Write-Error "signtool.exe was not found on this runner."
          exit 1
        }
        $tool = $candidates | Where-Object { $_.FullName -match '\\x64\\' } | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $tool) { $tool = $candidates | Sort-Object FullName -Descending | Select-Object -First 1 }
        Add-Content -Path $env:GITHUB_ENV -Value "SIGNTOOL_PATH=$($tool.FullName)"
      shell: pwsh

    # =====================================================================
    # Декодування PFX із секрету, підпис .sys і .cat, експорт публічного
    # сертифіката (.cer) для встановлення довіри на цільових машинах.
    # =====================================================================
    - name: Sign .sys and .cat with SignTool
      run: |
        $ErrorActionPreference = "Stop"
        $pfxPath = Join-Path $env:TEMP "signcert.pfx"
        $cerPath = Join-Path $env:PACKAGE_DIR "$env:DRIVER_NAME.cer"

        try {
          Write-Host "==> Decoding SIGN_CERT_PFX into a temporary file"
          $bytes = [Convert]::FromBase64String($env:SIGN_CERT_PFX)
          [IO.File]::WriteAllBytes($pfxPath, $bytes)

          Write-Host "==> Signing $env:SYS_PATH"
          & "$env:SIGNTOOL_PATH" sign /v /fd SHA256 /f "$pfxPath" /p "$env:SIGN_CERT_PASSWORD" `
            /tr http://timestamp.digicert.com /td SHA256 "$env:SYS_PATH"
          if ($LASTEXITCODE -ne 0) { Write-Error "Signing .sys failed (exit code $LASTEXITCODE)."; exit 1 }

          Write-Host "==> Signing $env:CAT_PATH"
          & "$env:SIGNTOOL_PATH" sign /v /fd SHA256 /f "$pfxPath" /p "$env:SIGN_CERT_PASSWORD" `
            /tr http://timestamp.digicert.com /td SHA256 "$env:CAT_PATH"
          if ($LASTEXITCODE -ne 0) { Write-Error "Signing .cat failed (exit code $LASTEXITCODE)."; exit 1 }

          Write-Host "==> Exporting public certificate for target-machine trust -> $cerPath"
          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2(
            $pfxPath, $env:SIGN_CERT_PASSWORD,
            [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable
          )
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null

          Write-Host "OK: .sys and .cat signed; .cer exported."
        }
        finally {
          if (Test-Path $pfxPath) {
            Write-Host "==> Removing temporary .pfx"
            Remove-Item -Path $pfxPath -Force
          }
        }
      shell: pwsh
      env:
        SIGN_CERT_PFX: ${{ secrets.CERT }}
        SIGN_CERT_PASSWORD: ${{ secrets.CERT_PWD }}

    # =====================================================================
    # GUI: .NET SDK, restore, дві публікації (framework-dependent і
    # self-contained). Драйвер уже зібраний і підписаний вище в цьому ж
    # job, тому WDK/MSBuild-тулчейн і .NET SDK просто співіснують на одному
    # раннері - окремий job тут не потрібен.
    # =====================================================================
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore GUI project
      run: dotnet restore "$env:GUI_PROJECT_DIR\$env:GUI_PROJECT_NAME.csproj"
      shell: pwsh

    # Framework-dependent single file, win-x64: exe важить одиниці МБ, але
    # потребує встановленого на цільовій машині .NET 8 Desktop Runtime.
    # Це те, що йде в "Min" архів.
    - name: Publish GUI (framework-dependent, single file, win-x64)
      run: |
        dotnet publish "$env:GUI_PROJECT_DIR\$env:GUI_PROJECT_NAME.csproj" `
          -c Release `
          -r win-x64 `
          --self-contained false `
          -p:PublishSingleFile=true `
          -o artifacts/gui-min
      shell: pwsh

    # Self-contained single file, win-x64: важчий exe (вбудований CLR/WPF),
    # зате нічого встановлювати додатково не треба. Йде в "Full" архів.
    - name: Publish GUI (self-contained, single file, win-x64)
      run: |
        dotnet publish "$env:GUI_PROJECT_DIR\$env:GUI_PROJECT_NAME.csproj" `
          -c Release `
          -r win-x64 `
          --self-contained true `
          -p:PublishSingleFile=true `
          -p:IncludeNativeLibrariesForSelfExtract=true `
          -p:EnableCompressionInSingleFile=true `
          -o artifacts/gui-full
      shell: pwsh

    # =====================================================================
    # Формуємо однакову структуру WellspringPTP/Driver + WellspringPTP/Gui
    # для обох варіантів. upload-artifact нижче заархівує кожну з цих
    # папок РІВНО ОДИН РАЗ - без ручного zip, тому нема архіву-в-архіві.
    # =====================================================================
    - name: Stage folder structure (WellspringPTP/Driver + WellspringPTP/Gui)
      run: |
        $ErrorActionPreference = "Stop"

        New-Item -ItemType Directory -Path "stage/min/WellspringPTP/Driver"  -Force | Out-Null
        New-Item -ItemType Directory -Path "stage/min/WellspringPTP/Gui"     -Force | Out-Null
        New-Item -ItemType Directory -Path "stage/full/WellspringPTP/Driver" -Force | Out-Null
        New-Item -ItemType Directory -Path "stage/full/WellspringPTP/Gui"    -Force | Out-Null

        Copy-Item -Path "artifacts/driver/*"   -Destination "stage/min/WellspringPTP/Driver"  -Recurse -Force
        Copy-Item -Path "artifacts/driver/*"   -Destination "stage/full/WellspringPTP/Driver" -Recurse -Force

        Copy-Item -Path "artifacts/gui-min/*"  -Destination "stage/min/WellspringPTP/Gui"  -Recurse -Force
        Copy-Item -Path "artifacts/gui-full/*" -Destination "stage/full/WellspringPTP/Gui" -Recurse -Force

        Write-Host "== stage/min =="
        Get-ChildItem -Recurse "stage/min" | Select-Object -ExpandProperty FullName
        Write-Host "== stage/full =="
        Get-ChildItem -Recurse "stage/full" | Select-Object -ExpandProperty FullName
      shell: pwsh

    # path вказує на батьківську теку stage/min - тоді у корені завантаженого
    # артефакту буде саме папка WellspringPTP (а не її вміст напряму), як і
    # вимагалось: в архіві -> WellspringPTP -> Driver, Gui.
    - name: Upload Min archive (Driver + GUI without bundled .NET)
      uses: actions/upload-artifact@v4
      with:
        name: WellspringPTP-Min-${{ env.DRIVER_VERSION }}
        path: stage/min
        if-no-files-found: error

    - name: Upload Full archive (Driver + GUI, self-contained)
      uses: actions/upload-artifact@v4
      with:
        name: WellspringPTP-Full-${{ env.DRIVER_VERSION }}
        path: stage/full
        if-no-files-found: error