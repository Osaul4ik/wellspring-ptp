name: StaticAnalysis

on:
  pull_request:
    branches: [ master ]
  workflow_dispatch:

# Cancel superseded runs on the same PR/branch instead of burning runner time.
concurrency:
  group: static-analysis-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege by default; this job only needs to read the repo.
permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  PROJECT_DIR: src/AmtPtpDeviceUsbKm
  DRIVER_NAME: AmtPtpDeviceUsbKm
  # Experimental haptic actuator driver (src/AmtHapticDeviceUsbKm).
  HAPTIC_PROJECT_DIR: src/AmtHapticDeviceUsbKm
  HAPTIC_DRIVER_NAME: AmtHapticDeviceUsbKm
  CONFIGURATION: Release
  PLATFORM: x64
  # Strict mode: PREfast warnings fail the build, not just get logged.
  CA_TREAT_WARNINGS_AS_ERRORS: true

jobs:
  analyze:
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Install WDK
      run: |
        $ErrorActionPreference = "Stop"
        $wdkUrl = "https://go.microsoft.com/fwlink/?linkid=2085767"
        $wdkInstaller = "$env:TEMP\wdksetup.exe"
        Invoke-WebRequest -Uri $wdkUrl -OutFile $wdkInstaller

        # Start-Process does NOT set $LASTEXITCODE - that variable is only
        # populated by direct invocation of a native exe. Capture the
        # process object with -PassThru and read its ExitCode explicitly,
        # or this check silently "fails" every run regardless of outcome
        # (comparing $null -ne 0 evaluates to $true in PowerShell).
        $proc = Start-Process -FilePath $wdkInstaller -ArgumentList "/quiet /norestart" -Wait -PassThru
        $exitCode = $proc.ExitCode

        # WDK/VS installers commonly return 3010 (success, reboot required)
        # or 0 (success). Anything else is a real failure.
        if ($exitCode -ne 0 -and $exitCode -ne 3010) {
          Write-Error "WDK installer exited with code $exitCode"
          exit 1
        }

        Write-Host "OK: WDK installer exited with code $exitCode"
      shell: pwsh

    - name: Build with PREfast (/analyze) enabled
      id: build
      run: |
        # PowerShell does not fail a script on a non-zero exit code from a
        # native process by default - it only sets $LASTEXITCODE. Always
        # check it explicitly after msbuild, or a broken build will report
        # a green checkmark.
        $ErrorActionPreference = "Stop"

        # Logs must live INSIDE the checked-out workspace, not $env:TEMP -
        # actions/upload-artifact@v4 computes a single common root directory
        # for all uploaded paths and errors out if any path falls outside
        # the repo tree (as happened when the binlog lived under TEMP while
        # other paths were repo-relative).
        $logDir = Join-Path $env:GITHUB_WORKSPACE "static-analysis-logs"
        New-Item -ItemType Directory -Path $logDir -Force | Out-Null
        $binLog = Join-Path $logDir "build.binlog"
        $buildLog = Join-Path $logDir "build.log"
        $treatAsErrors = $env:CA_TREAT_WARNINGS_AS_ERRORS

        # The project already compiles with /W4 /WX, and PREfast/analyze
        # diagnostics (C6xxx) are emitted through the same compiler
        # diagnostic pipe as ordinary warnings - so /WX already fails the
        # build on any PREfast finding. No separate CodeAnalysisLog.xml
        # parsing step is needed (that file format belongs to the older,
        # non-integrated Code Analysis MSBuild target and isn't produced
        # by this build pipeline).
        & msbuild "$env:PROJECT_DIR\$env:DRIVER_NAME.vcxproj" `
          /p:Configuration=$env:CONFIGURATION `
          /p:Platform=$env:PLATFORM `
          /p:WindowsTargetPlatformVersion=10.0.26100.0 `
          /p:RunCodeAnalysis=true `
          /p:EnableCppCoreCheck=true `
          /p:CodeAnalysisTreatWarningsAsErrors=$treatAsErrors `
          /nologo `
          /verbosity:normal `
          /clp:Summary `
          "/bl:$binLog" `
          2>&1 | Tee-Object -FilePath $buildLog

        $exitCode = $LASTEXITCODE
        Add-Content -Path $env:GITHUB_ENV -Value "BUILD_LOG_DIR=$logDir"

        if ($exitCode -ne 0) {
          Write-Host "::error::msbuild exited with code $exitCode (build failure and/or PREfast finding - see build.log)"
          exit $exitCode
        }

        Write-Host "OK: build + PREfast analysis completed with exit code 0, zero warnings (enforced by /W4 /WX)"
      shell: pwsh

    # Same strict PREfast pass for the haptic actuator driver. !cancelled()
    # instead of the default success() so a finding in one driver does not
    # hide the result for the other: both show up in one run.
    - name: Build Haptic Actuator driver with PREfast (/analyze) enabled
      if: ${{ !cancelled() }}
      run: |
        $ErrorActionPreference = "Stop"

        $logDir = Join-Path $env:GITHUB_WORKSPACE "static-analysis-logs"
        New-Item -ItemType Directory -Path $logDir -Force | Out-Null
        $binLog = Join-Path $logDir "haptic.binlog"
        $buildLog = Join-Path $logDir "haptic.log"
        $treatAsErrors = $env:CA_TREAT_WARNINGS_AS_ERRORS

        # Output folders come from the vcxproj itself, like the touchpad
        # driver's. Do not override OutDir/IntDir here: without a trailing
        # backslash MSBuild only warns (MSB8004) and cl then fails on /Fo with
        # several sources (D8036).
        & msbuild "$env:HAPTIC_PROJECT_DIR\$env:HAPTIC_DRIVER_NAME.vcxproj" `
          /p:Configuration=$env:CONFIGURATION `
          /p:Platform=$env:PLATFORM `
          /p:WindowsTargetPlatformVersion=10.0.26100.0 `
          /p:RunCodeAnalysis=true `
          /p:EnableCppCoreCheck=true `
          /p:CodeAnalysisTreatWarningsAsErrors=$treatAsErrors `
          /nologo `
          /verbosity:normal `
          /clp:Summary `
          "/bl:$binLog" `
          2>&1 | Tee-Object -FilePath $buildLog

        $exitCode = $LASTEXITCODE
        if ($exitCode -ne 0) {
          Write-Host "::error::Haptic Actuator msbuild exited with code $exitCode (build failure and/or PREfast finding - see haptic.log)"
          exit $exitCode
        }

        Write-Host "OK: Haptic Actuator build + PREfast analysis completed with exit code 0"
      shell: pwsh

    - name: Upload build and analysis logs
      # Always upload, even on failure - this is the artifact you actually
      # open to debug a red run instead of scrolling the raw log.
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: static-analysis-logs
        retention-days: 14
        if-no-files-found: warn
        path: static-analysis-logs/
